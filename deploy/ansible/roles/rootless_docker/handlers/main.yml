---
- name: Restart rootless docker
  become: true
  become_user: "{{ rootless_docker_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ rootless_docker_uid }}"
  ansible.builtin.systemd_service:
    name: docker
    scope: user
    state: restarted

- name: Reload apparmor profile of rootlesskit
  ansible.builtin.command: apparmor_parser -r /etc/apparmor.d/usr.bin.rootlesskit
  changed_when: true
