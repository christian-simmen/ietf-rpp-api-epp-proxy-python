# The proxy in front of DENIC's RRI test environment (MTEST), for the integration suite (RPP_TEST_ENV=rri-mtest).
# The credentials are the clients' own: HTTP Basic is passed through as the RRI LOGIN.
rpp_backend: rri
rpp_rri_host: rri.test.denic.de
rpp_rri_port: 51131
rpp_rri_use_tls: true
rpp_rri_tls_insecure_skip_verify: false
# How a client names the preset of a request (core, Preset Signalling): `header` is the RPP-Preset header field,
# `media-type` the preset and preset-version parameters of Accept and Content-Type. Without the key it is `header`. A
# request that names none gets default_preset below.
rpp_preset_signalling: media-type

# The profile of this server (see config.yaml): DENIC's, src/settings/profiles/rri.yaml.
rpp_backend_profile:
  extends: rri
  # The RPP presets offered (src/rpp/schema/schemas/presets), and the one a request gets when it names none.
  presets:
    - base
    - rri
  default_preset: rri
rpp_rri_lgr: latn-1.0   # the one LGR name a client may give for DENIC's IDN repertoire (gap Q11)

# What the discovery document states (placeholders for the test deployment).
rpp_base_url: https://localhost:8000
rpp_tlds:
  - de
rpp_environment_name: rpp-rri-proxy.example
rpp_environment_status: test
