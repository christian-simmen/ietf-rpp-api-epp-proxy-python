# The SQLite demo backend whose server binds profiles to the presets it offers (#180): server policy, apart from the
# definitions of the presets and the profiles. `planets` is bound to rocky-planets (the type of a planet is rocky),
# planets-atmosphere to habitable-atmospheres, and planets-complete to habitable-rocky-planets, which builds on
# habitable-atmospheres and so needs the atmosphere extension that planets-complete holds. catalogued-planets has the
# profiles of its definition and none bound. The preset is signalled in the media type. It is the test environment
# `sqlite-demo-bound`.
rpp_backend: sqlite

# The database: a SQLAlchemy URL, a file (sqlite:///demo.db) or one in memory (sqlite://), which starts empty.
rpp_sqlite_url: sqlite://

# The clients: the user of the Basic authentication, and the hash of its password (`scrypt$...`, made by
# `python -m registry_adapter.sqlite.hash_password`, which reads the password from its standard input). The user is the
# sponsoring client of what it creates. The passwords are DEMO values, the same as in
# tests/integration/environments/sqlite-demo.yaml: demo-a-password, demo-b-password, demo-c-password and
# demo-d-password (the cases about the message queue use c and d only, so that no other case adds to their queues). A real deployment never keeps
# them: it makes its own hashes.
rpp_sqlite_clients:
  demo-a: scrypt$4096$8$1$/KkO8lOLGvobDljcFirbIg==$UdihO4qzdOTc1fYD1mk/cuVD4CpSQomj9tKX/79SnM4=
  demo-b: scrypt$4096$8$1$/2DzvTsWK2PM5ra/Q4ZZVw==$xXScrBzRxgzIkXg4ukOtCCFTsF02PVdhxJZCNsz2CTk=
  demo-c: scrypt$4096$8$1$PwbpFHgXKZxhnlm8bGEdFA==$jFEoc+sV7exqTS4gyvGgbfDrbdV4eCLECJeQP5xNSo4=
  demo-d: scrypt$4096$8$1$y+jGjUJj/qZbBXfkBRh3yQ==$PGBsQP5Ebg/aywY1PmRW3KMaj4va7+qlThhdeyYSNio=

# The extensions this deployment is built with (docs/demo/).
rpp_extensions:
  - extensions.planets
  - extensions.planet_atmosphere
  - extensions.satellite_orbit

rpp_preset_signalling: media-type

rpp_backend_profile:
  extends: sqlite
  presets:
    - base
    - planets
    - planets-atmosphere
    - planets-complete
    - catalogued-planets
  default_preset: planets
  bound_profiles:
    planets:
      - rocky-planets
    planets-atmosphere:
      - habitable-atmospheres
    planets-complete:
      - habitable-rocky-planets

# What the discovery document states (placeholders for the test deployment).
rpp_base_url: https://localhost:8000
rpp_tlds:
  - example
rpp_environment_name: rpp-sqlite-demo.example
rpp_environment_status: test

# The OpenAPI document served shows only what the demo serves: not the operations on the drafts' objects, which the demo
# backend does not hold, nor those no handler serves. Against the drafts' API contract, which lists them all; requests to
# them still answer 501 (#204).
rpp_openapi_omit_unheld_objects: true
rpp_openapi_omit_unimplemented: true
