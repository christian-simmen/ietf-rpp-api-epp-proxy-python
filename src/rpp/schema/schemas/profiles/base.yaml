# The base profile: the data objects of the RPP drafts, with no extension. A private profile (json §6.11): the name is in
# reverse domain notation.
name: io.github.pawel-kow.rpp.profile.base
description: Base profile of the RPP proxy, the data objects of the RPP drafts without extensions
version: "1.0"
rppVersion: "1.0"
objects:
  - domainName
  - contact
  - host
extensions: []
